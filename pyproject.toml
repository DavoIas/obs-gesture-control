[project]
name = "obs-gesture-control"
version = "2.0.0"
description = "Controle por gestos para o OBS Studio via WebSocket 5.x"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py310"
exclude = [".venv", "venv", "__pycache__", "build", "dist", ".git"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402", "F401", "F841", "W293"]
